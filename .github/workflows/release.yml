name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GAME_REFS_URL: ${{ secrets.GAME_REFS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Static smoke
        run: python tools/static_smoke.py

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            python tools/version_check.py --tag $env:GITHUB_REF_NAME
          } else {
            python tools/version_check.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare game references
        shell: pwsh
        run: |
          # The committed refs/ directory (stubs + BepInEx + Unity NuGet modules) is
          # sufficient for compilation — the mod's references resolve to real game
          # types at runtime via BepInEx assembly loading. If GAME_REFS_URL is
          # configured, we override with the real game refs for full ABI verification.
          # No GitHub Secret is required for the default build path.
          if ([string]::IsNullOrWhiteSpace($env:GAME_REFS_URL)) {
            Write-Host "GAME_REFS_URL not configured. Using committed build refs (stubs + BepInEx + Unity NuGet)."
            Add-Content -Path $env:GITHUB_ENV -Value "GAME_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'refs')"
          } else {
            Write-Host "GAME_REFS_URL is configured. Downloading real game references for ABI verification."
            $gameDir = Join-Path $env:RUNNER_TEMP 'game'
            New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
            $refsZip = Join-Path $env:RUNNER_TEMP 'game-refs.zip'
            Invoke-WebRequest -Uri $env:GAME_REFS_URL -OutFile $refsZip
            Expand-Archive -Path $refsZip -DestinationPath $gameDir
            Add-Content -Path $env:GITHUB_ENV -Value "GAME_DIR=$gameDir"
          }
          Write-Host "GameDir=$env:GAME_DIR"

      - name: Run tests
        run: dotnet test HealthAutoArrange.Tests/HealthAutoArrange.Tests.csproj --configuration Release

      - name: Build Plugin (Release)
        shell: pwsh
        run: dotnet build HealthAutoArrange.Plugin/HealthAutoArrange.Plugin.csproj --configuration Release -p:GameDir="$env:GAME_DIR"

      - name: Package mod DLLs
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'HealthAutoArrange.Plugin/bin/Release/net472/HealthAutoArrange.Plugin.dll' $staging
          Copy-Item 'HealthAutoArrange.Core/bin/Release/netstandard2.0/HealthAutoArrange.Core.dll' $staging
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = 'manual'
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "HealthAutoArrange-$version.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath
          Write-Host "Package=$zipPath"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ZIP=$zipPath"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - name: Build update manifest (schema=2, unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $notesUrl = "https://github.com/$repo/releases/tag/$tag"
          $publishedUtc = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $manifest = @(
            'schema=2'
            "version=$($env:RELEASE_VERSION)"
            "notesUrl=$notesUrl"
            "publishedUtc=$publishedUtc"
          ) -join "`n"
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.txt'
          [IO.File]::WriteAllText($manifestPath, $manifest + "`n", [Text.UTF8Encoding]::new($false))
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_MANIFEST=$manifestPath"
          Write-Host "Unsigned schema=2 update manifest generated."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthAutoArrange-${{ env.RELEASE_VERSION }}
          path: ${{ env.RELEASE_ZIP }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.UPDATE_MANIFEST }}
          generate_release_notes: true

      - name: Publish update manifest to update-dist branch
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mirrorDir = Join-Path $env:RUNNER_TEMP 'update-dist'
          if (Test-Path $mirrorDir) { Remove-Item -Recurse -Force $mirrorDir }
          $repoUrl = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git clone --depth 1 --branch update-dist $repoUrl $mirrorDir
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $mirrorDir) { Remove-Item -Recurse -Force $mirrorDir }
            git clone --depth 1 $repoUrl $mirrorDir
            if ($LASTEXITCODE -ne 0) { throw "Could not clone repository for update-dist branch." }
            Push-Location $mirrorDir
            git checkout --orphan update-dist
            git rm -rf . 2>$null
            Pop-Location
          }

          Copy-Item $env:UPDATE_MANIFEST (Join-Path $mirrorDir 'latest.txt') -Force

          Push-Location $mirrorDir
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.txt
          git commit -m "update: publish GitHub release v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'No mirror changes to commit.' }
          git push origin HEAD:update-dist
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub update manifest." }
          Pop-Location
